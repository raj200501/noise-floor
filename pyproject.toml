[project]
name = "evalstats"
version = "0.0.1"
description = "Statistics for eval results: paired and clustered comparisons, intervals, power, rank confidence, and variance components."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Raj Kashikar" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
]

[project.scripts]
evalstats = "evalstats.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.1",
    "scipy-stubs>=1.11",
    "statsmodels>=0.14",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

# The published wheel contains only the evalstats library. The noisefloor study
# package lives beside it in src/ and is importable in the dev environment through
# the editable install (dev-mode-dirs), but it is not shipped in the wheel.
[tool.hatch.build.targets.wheel]
packages = ["src/evalstats"]

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL", "D"]
ignore = ["PLR0913", "PLR2004", "D203", "D213", "D401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR"]
"tools/**" = ["D", "PLR", "PLC0415"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
packages = ["evalstats", "noisefloor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["property: property-based tests (hypothesis)"]

[tool.coverage.run]
source = ["src/evalstats", "src/noisefloor"]
branch = false
# Adapters that need external services may be listed here only if a
# recorded-fixture contract test covers them (tests/contract/test_<module>.py);
# tools/ship_check.py enforces this.
omit = []

[tool.coverage.report]
show_missing = true
